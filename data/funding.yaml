funders:
  - name: "European Commission — Horizon 2020"
    short: "Horizon 2020"
    logo: "/images/funding/holoruminant-logo.png"
    logo_dark: true
    statement: "The Creevey Lab has received funding from the European Union's Horizon 2020 research and innovation programme under grant agreement N° 101000213 – HoloRuminant. This website reflects the views only of the authors, and not the European Commission (EC); the EC is not liable for any use that may be made of the information contained herein."
  - name: "European Commission — Horizon Europe (Marie Skłodowska-Curie Actions)"
    short: "Rumen-Innovate (MSCA Doctoral Network)"
    logo: "/images/funding/eu-flag.svg"
    statement: "Chris Creevey coordinates Rumen-Innovate (Grant Agreement ID 101311612), a €4.8 million Horizon Europe Marie Skłodowska-Curie Actions Doctoral Network launching in March 2027, bringing together 11 institutions and 19 industry and research partners to train the next generation of ruminant microbiome scientists and develop tools to reduce agricultural methane emissions."
  - name: "Biotechnology & Biological Sciences Research Council"
    short: "BBSRC"
    logo: "/images/funding/bbsrc-logo.png"
    statement: "Supports our work on antimicrobial resistance and poultry health, including the ZnO & AMR and Broiler Stunting projects, and previously the Helminth Diversity project."
  - name: "Medical Research Council"
    short: "MRC"
    logo: "/images/funding/mrc-logo.png"
    statement: "Funds our research into multi-drug resistance evolution and transmission across the One Health interface (MDR Evolution), and previously supported the four-nations Wastewater Harmonisation project."
  - name: "Engineering and Physical Sciences Research Council"
    short: "EPSRC"
    logo: "/images/funding/epsrc-logo.png"
    statement: "Supports the SUSTAIN Centre for Doctoral Training, training the next generation of AI researchers for sustainable agri-food systems."
  - name: "Department of Agriculture, Environment and Rural Affairs"
    short: "DAERA"
    logo: "/images/funding/daera-icon.svg"
    statement: "Funds several of our projects across food systems and the environment, including the Food-CoCentre for Sustainable Food Systems, phage-based biocontrol of harmful algal blooms with AquaPhage, and the Intercropping evaluation of cereal and protein crop systems."
  - name: "Department for Environment, Food & Rural Affairs"
    short: "DEFRA"
    statement: "Supported the SeaSolutions project, investigating the use of seaweed to reduce enteric methane emissions in livestock."
  - name: "Defence Science and Technology Laboratory"
    short: "DSTL / MOD"
    statement: "Supports our membership of the UK Microbial Forensics Capability network (UKMFC)."
  - name: "Department of Health, Northern Ireland"
    short: "DoH NI"
    logo: "/images/funding/dohni-icon.svg"
    statement: "Supported the SARS-CoV-2 Wastewater Surveillance Programme during the COVID-19 pandemic."
  - name: "Public Health Agency"
    short: "PHA"
    logo: "/images/funding/pha-logo.png"
    logo_dark: true
    statement: "Supported the PATHSAFE pathogen surveillance programme across agriculture, food, and the environment."
  - name: "Health and Social Care Research & Development Division"
    short: "HSC R&D"
    logo: "/images/funding/pha-logo.png"
    logo_dark: true
    statement: "Funds PATHSAFE 2, extending pathogen surveillance across agriculture, food, and environmental systems."
  - name: "Northern Ireland Department for the Economy"
    short: "DfE NI"
    logo: "/images/funding/dfeni-icon.svg"
    statement: "Supports our research into the production, application, and environmental impact of biodegradable PHA-based polymers."
  - name: "The Urology Foundation"
    short: "TUF"
    logo: "/images/funding/tuf-logo.svg"
    statement: "Funds Micro-Mach UTI, combining microbiome sequencing and machine learning to improve the detection and treatment of urinary tract infections."
  - name: "NI Kidney Research Fund"
    short: "NI Kidney Research Fund"
    logo: "/images/funding/ni-kidney-research-fund-logo.png"
    statement: "Supports early detection and pre-emptive management of urinary tract infection and catheter-related sepsis in renal patients."
