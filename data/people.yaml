  - name: "Dr. James Gillespie"
    photo: "/images/people/james-gillespie.jpeg"
    title: "Postdoctoral Research Fellow"
    initials: "JG"
    bio: "PhD in Machine Learning, with experience ranging from reinforcement learning to transformer-based models. Current research focuses on developing machine learning tools for the Co-Centre for Sustainable Food Systems, with additional interests in machine learning for genomics."
    email: "j.gillespie@qub.ac.uk"

